<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Office menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Office menu" style="box-sizing: border-box; width: 100%; min-height: 900px; padding: 24px 16px; background: #0a1628; color: #ffffff; font-family: 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a8c8ff" stroke-width="2" stroke-linejoin="round"><path d="M3 6h6l2 2h10v11H3z"></path></svg>
<span style="font-family: 'Montserrat', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.12em">KOMON PORTAL</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{items}}" as="item" hint-placeholder-count="9">
<a href="{{item.href}}" style="{{item.style}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.d}}"></path></svg>
<span style="flex-grow: 1">{{item.label}}</span>
<sc-if value="{{item.hasCount}}" hint-placeholder-val="{{ false }}">
<span style="{{item.countStyle}}">{{item.count}}</span>
</sc-if>
</a>
</sc-for>
</div>
<div style="margin-top: auto; padding: 16px 8px 0; border-top: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; font-weight: 500">Aoba Labor Office</span>
<span style="font-size: 12px; color: rgba(255,255,255,0.65)">Signed in as Owner</span>
<a href="SignIn.dc.html" style="margin-top: 8px; font-size: 12px; color: #a8c8ff; min-height: 44px; display: flex; align-items: center">Sign out</a>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Dashboard","Intake","Review","Staged","Clients","Shelf","Cases","Settings","Audit Log"],"default":"Dashboard"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'Dashboard';
const base = 'display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: 4px; font-size: 14px; text-decoration: none; ';
const defs = [
['Dashboard', 'Main.dc.html', 'M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z', 0, ''],
['Intake', 'Intake.dc.html', 'M12 16V4M7 9l5-5 5 5M4 20h16', 0, ''],
['Review', 'Review.dc.html', 'M12 3l10 18H2L12 3zM12 10v5M12 18v.5', 7, 'background: #ffe2c2; color: #7a3a00; '],
['Staged', 'Staged.dc.html', 'M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2', 12, 'background: #d8e8f8; color: #0d3c78; '],
['Clients', 'Clients.dc.html', 'M4 21V5l8-2v18M12 9h8v12M2 21h20', 0, ''],
['Shelf', 'Shelf.dc.html', 'M3 6h6l2 2h10v11H3z', 0, ''],
['Cases', 'Cases.dc.html', 'M3 8h18v11H3zM9 8V5h6v3', 0, ''],
['Settings', 'Settings.dc.html', 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M16 4v4M10 10v4M18 16v4', 0, ''],
['Audit Log', '#audit', 'M8 6h12M8 12h12M8 18h12M4 6h.5M4 12h.5M4 18h.5', 0, '']
];
const items = defs.map(([label, href, d, count, tint]) => ({
label, href, d, count,
hasCount: count > 0,
countStyle: tint + 'min-width: 24px; padding: 1px 6px; border-radius: 4px; font-size: 12px; font-weight: 700; text-align: center; box-sizing: border-box',
style: base + (label === active
? 'background: #1a3560; color: #ffffff; font-weight: 700'
: 'color: rgba(255,255,255,0.82); font-weight: 400')
}));
return { items };
}
}
</script>
</body>
</html>
