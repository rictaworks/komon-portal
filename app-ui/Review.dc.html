<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Office review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1565c0}a:hover{color:#0a1628}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 960px; background: #f0f4f8; color: #0a1628; font-family: 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.6">
<div style="flex: 1 1 220px; max-width: 240px; background: #0a1628">
<dc-import name="Sidebar" active="Review" hint-size="100%,900px"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<h1 style="margin: 0; flex-grow: 1; font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 800; letter-spacing: 0.04em">Review</h1>
<label for="reason" style="font-size: 13px; color: #4a5a78">Reason</label>
<select id="reason" style="min-height: 44px; padding: 0 12px; border: 1px solid #6b82a0; border-radius: 4px; background: #ffffff; color: #0a1628; font: inherit"><option>All reasons</option><option>Conflicting keys</option><option>No key</option><option>Hint mismatch</option><option>Duplicate across clients</option><option>Client not active</option></select>
<label for="q" style="font-size: 13px; color: #4a5a78">Client code</label>
<input id="q" type="search" placeholder="C0031" style="min-height: 44px; width: 160px; box-sizing: border-box; padding: 0 12px; border: 1px solid #6b82a0; border-radius: 4px; font: inherit">
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<section aria-label="Documents needing review" style="flex: 1 1 380px; min-width: 0; background: #ffffff; border: 1px solid rgba(10,22,40,0.1); border-radius: 8px; overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<button type="button" style="{{r.style}}">
<span style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
<strong style="font-size: 13px">{{r.file}}</strong>
<span style="font-size: 12px; color: #4a5a78">Received {{r.received}}</span>
</span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 4px; background: #fff0e0; color: #8a4300; font-size: 12px; font-weight: 700; white-space: nowrap"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3zM12 10v5M12 18v.5"></path></svg>{{r.reason}}</span>
</button>
</sc-for>
</section>

<section aria-label="Decision" style="flex: 1 1 460px; min-width: 0; background: #ffffff; border: 1px solid rgba(10,22,40,0.1); border-radius: 8px; overflow: hidden">
<div style="padding: 14px 20px; background: #0a1628; color: #ffffff; display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px">
<span style="font-size: 12px; color: rgba(255,255,255,0.65)">Assigning to</span>
<strong style="font-family: 'Montserrat', sans-serif; font-size: 18px; letter-spacing: 0.04em">C0142</strong>
<span style="font-size: 15px; font-weight: 500">Kita Seimitsu</span>
</div>
<div style="padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div>
<h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 700">Pending file 4</h2>
<span style="font-size: 13px; color: #4a5a78">ZIP, 1.8 MB, received 24 Nov 2026 09:12</span>
</div>
<div style="padding: 14px 16px; background: #fff0e0; border: 1px solid #f0c48a; border-radius: 8px; color: #6b3400; font-size: 13px; display: flex; flex-direction: column; gap: 6px">
<strong>Conflicting keys</strong>
<span>Arrival number 202611240912345678 belongs to a case of C0031 Hinode Logistics.</span>
<span>Client code at the start of the file name is C0142 Kita Seimitsu.</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px; grid-column: span 2">
<label for="client" style="font-weight: 700; font-size: 13px">Client (required)</label>
<select id="client" style="min-height: 44px; padding: 0 12px; border: 1px solid #6b82a0; border-radius: 4px; background: #ffffff; color: #0a1628; font: inherit"><option>C0142 Kita Seimitsu</option><option>C0031 Hinode Logistics</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="case" style="font-weight: 700; font-size: 13px">Case (optional)</label>
<select id="case" style="min-height: 44px; padding: 0 12px; border: 1px solid #6b82a0; border-radius: 4px; background: #ffffff; color: #0a1628; font: inherit"><option>Employment insurance 2026-11 #1</option><option>No case</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="type" style="font-weight: 700; font-size: 13px">Document type (optional)</label>
<select id="type" style="min-height: 44px; padding: 0 12px; border: 1px solid #6b82a0; border-radius: 4px; background: #ffffff; color: #0a1628; font: inherit"><option>Unclassified</option><option>KOYOU Employment insurance notice</option><option>SHAHO Social insurance notice</option></select>
</div>
</div>
<label style="display: flex; align-items: flex-start; gap: 12px; min-height: 44px; padding: 10px 12px; border: 1px solid #6b82a0; border-radius: 4px; font-size: 13px">
<input type="checkbox" style="width: 20px; height: 20px; margin: 2px 0 0">
<span>I checked the conflict above and confirm that this document belongs to <strong>C0142 Kita Seimitsu</strong>.</span>
</label>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<button type="button" style="min-height: 44px; padding: 0 24px; border: 0; border-radius: 4px; background: #1565c0; color: #ffffff; font: inherit; font-weight: 700">Confirm and stage</button>
<button type="button" style="min-height: 44px; padding: 0 20px; border: 1px solid #1a3560; border-radius: 4px; background: #ffffff; color: #1a3560; font: inherit; font-weight: 700">Open file</button>
<button type="button" style="min-height: 44px; padding: 0 20px; margin-left: auto; border: 1px solid #a31515; border-radius: 4px; background: #ffffff; color: #a31515; font: inherit; font-weight: 700">Move to trash</button>
</div>
</div>
</section>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const base = 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; box-sizing: border-box; padding: 12px 20px; border: 0; border-bottom: 1px solid rgba(10,22,40,0.08); text-align: left; font: inherit; color: #0a1628; ';
const row = (file, received, reason, on) => ({ file, received, reason, style: base + (on ? 'background: #e3eefc; box-shadow: inset 4px 0 0 #1565c0' : 'background: #ffffff') });
return { rows: [
row('Pending file 4', '24 Nov 09:12', 'Conflicting keys', true),
row('Pending file 5', '24 Nov 09:12', 'No key', false),
row('Pending file 2', '21 Nov 16:40', 'Hint mismatch', false),
row('Pending file 9', '21 Nov 16:38', 'Duplicate across clients', false),
row('Pending file 1', '20 Nov 11:05', 'Multiple arrival numbers', false),
row('Pending file 3', '19 Nov 14:22', 'Client not active', false),
row('Pending file 6', '18 Nov 10:01', 'Case cancelled', false)
] };
}
}
</script>
</body>
</html>
